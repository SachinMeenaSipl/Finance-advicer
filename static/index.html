<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Planning Application - South Africa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .client-selector {
            margin-bottom: 20px;
        }
        
        .client-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
        }
        
        .metric {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .metric-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .metric-value {
            color: #333;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .metric-value.positive {
            color: #28a745;
        }
        
        .metric-value.negative {
            color: #dc3545;
        }
        
        .goal-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .goal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .goal-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        
        .goal-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .status-achievable {
            background: #d4edda;
            color: #155724;
        }
        
        .status-challenging {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-not_achievable {
            background: #f8d7da;
            color: #721c24;
        }
        
        .progress-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s;
        }
        
        .recommendation {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
            font-size: 0.95em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: bold;
            color: #667eea;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 Financial Planning Application</h1>
            <p>Professional Financial Advisory Tool for South Africa</p>
        </div>
        
        <div class="card full-width">
            <h2>Client Selection</h2>
            <div class="client-selector">
                <label for="clientSelect">Select Client:</label>
                <select id="clientSelect">
                    <option value="">-- Select a client --</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="loadAnalysis()">Load Analysis</button>
                <button class="btn btn-secondary" onclick="createDemoClient()">Create Demo Client</button>
            </div>
        </div>
        
        <div id="analysisContent" style="display: none;">
            <div class="main-content">
                <div class="card">
                    <h2>Cash Flow Analysis</h2>
                    <div id="cashFlowMetrics"></div>
                </div>
                
                <div class="card">
                    <h2>Net Worth Summary</h2>
                    <div id="netWorthMetrics"></div>
                </div>
                
                <div class="card full-width">
                    <h2>Financial Goals Assessment</h2>
                    <div id="goalsAnalysis"></div>
                </div>
                
                <div class="card full-width">
                    <h2>Recommended Savings Allocation</h2>
                    <div id="savingsPlan"></div>
                </div>
                
                <div class="card full-width">
                    <h2>Financial Recommendations</h2>
                    <div id="recommendations"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        // Load clients on page load
        window.addEventListener('load', () => {
            loadClients();
        });
        
        async function loadClients() {
            try {
                const response = await fetch(`${API_BASE}/clients`);
                const data = await response.json();
                
                const select = document.getElementById('clientSelect');
                select.innerHTML = '<option value="">-- Select a client --</option>';
                
                data.clients.forEach(client => {
                    const option = document.createElement('option');
                    option.value = client.client_id;
                    option.textContent = `${client.name} (${client.client_type}, Age ${client.age})`;
                    select.appendChild(option);
                });
                
                if (data.clients.length > 0) {
                    select.value = data.clients[0].client_id;
                }
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }
        
        async function createDemoClient() {
            try {
                const response = await fetch(`${API_BASE}/demo/create`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`Demo client "${data.name}" created successfully!`);
                    await loadClients();
                    
                    // Select the new client
                    document.getElementById('clientSelect').value = data.client_id;
                    await loadAnalysis();
                }
            } catch (error) {
                console.error('Error creating demo client:', error);
                alert('Error creating demo client');
            }
        }
        
        async function loadAnalysis() {
            const clientId = document.getElementById('clientSelect').value;
            
            if (!clientId) {
                alert('Please select a client');
                return;
            }
            
            document.getElementById('analysisContent').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/clients/${clientId}/analysis`);
                const data = await response.json();
                
                displayCashFlow(data.cash_flow);
                displayNetWorth(data.net_worth);
                displayGoalsAnalysis(data.goals_analysis);
                displaySavingsPlan(data.savings_plan);
                displayRecommendations(data.recommendations);
                
                document.getElementById('analysisContent').style.display = 'block';
            } catch (error) {
                console.error('Error loading analysis:', error);
                alert('Error loading analysis');
            }
        }
        
        function displayCashFlow(cashFlow) {
            const container = document.getElementById('cashFlowMetrics');
            const surplusClass = cashFlow.monthly_surplus >= 0 ? 'positive' : 'negative';
            
            container.innerHTML = `
                <div class="metric">
                    <div class="metric-label">Monthly Income</div>
                    <div class="metric-value">R${cashFlow.monthly_income.toLocaleString()}</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Monthly Expenses</div>
                    <div class="metric-value">R${cashFlow.monthly_expenses.toLocaleString()}</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Monthly Surplus</div>
                    <div class="metric-value ${surplusClass}">R${cashFlow.monthly_surplus.toLocaleString()}</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Savings Rate</div>
                    <div class="metric-value ${surplusClass}">${cashFlow.surplus_percentage}%</div>
                </div>
            `;
        }
        
        function displayNetWorth(netWorth) {
            const container = document.getElementById('netWorthMetrics');
            
            container.innerHTML = `
                <div class="metric">
                    <div class="metric-label">Total Assets</div>
                    <div class="metric-value positive">R${netWorth.total_assets.toLocaleString()}</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Total Liabilities</div>
                    <div class="metric-value negative">R${netWorth.total_liabilities.toLocaleString()}</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Net Worth</div>
                    <div class="metric-value">R${netWorth.net_worth.toLocaleString()}</div>
                </div>
                <div class="metric">
                    <div class="metric-label">Liquid Assets</div>
                    <div class="metric-value">R${netWorth.liquid_assets.toLocaleString()}</div>
                </div>
            `;
        }
        
        function displayGoalsAnalysis(goals) {
            const container = document.getElementById('goalsAnalysis');
            
            if (goals.length === 0) {
                container.innerHTML = '<p>No goals defined yet.</p>';
                return;
            }
            
            let html = '';
            goals.forEach(goal => {
                const statusClass = `status-${goal.status}`;
                
                html += `
                    <div class="goal-item">
                        <div class="goal-header">
                            <div class="goal-name">${goal.goal_name}</div>
                            <div class="goal-status ${statusClass}">${goal.confidence} confidence</div>
                        </div>
                        <div class="grid-2">
                            <div>
                                <strong>Target:</strong> R${goal.target_amount.toLocaleString()}
                            </div>
                            <div>
                                <strong>Current Savings:</strong> R${goal.current_savings.toLocaleString()}
                            </div>
                            <div>
                                <strong>Months Available:</strong> ${goal.months_available}
                            </div>
                            <div>
                                <strong>Required Monthly:</strong> R${goal.required_monthly_with_returns.toLocaleString()}
                            </div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(100, goal.achievability_percentage)}%"></div>
                        </div>
                        <div style="margin-top: 5px; font-size: 0.9em; color: #666;">
                            Achievability: ${goal.achievability_percentage}%
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function displaySavingsPlan(plan) {
            const container = document.getElementById('savingsPlan');
            
            let html = `
                <div class="grid-2">
                    <div class="metric">
                        <div class="metric-label">Available Monthly Surplus</div>
                        <div class="metric-value">R${plan.total_monthly_surplus.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Allocated to Goals</div>
                        <div class="metric-value">R${plan.total_allocated.toLocaleString()}</div>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Goal</th>
                            <th>Priority</th>
                            <th>Required</th>
                            <th>Allocated</th>
                            <th>Shortfall</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            plan.allocations.forEach(allocation => {
                html += `
                    <tr>
                        <td>${allocation.goal_name}</td>
                        <td>${allocation.priority}</td>
                        <td>R${allocation.required.toLocaleString()}</td>
                        <td>R${allocation.allocated.toLocaleString()}</td>
                        <td>${allocation.shortfall > 0 ? 'R' + allocation.shortfall.toLocaleString() : '-'}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
        
        function displayRecommendations(recommendations) {
            const container = document.getElementById('recommendations');
            
            if (recommendations.length === 0) {
                container.innerHTML = '<p>No specific recommendations at this time.</p>';
                return;
            }
            
            let html = '';
            recommendations.forEach(rec => {
                html += `<div class="recommendation">${rec}</div>`;
            });
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
